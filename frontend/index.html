<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLARITY - Learn Smarter, Build Your Future</title>
  <meta name="description"
    content="CLARITY is a modern SaaS educational platform offering interactive subject roadmaps, video recommendations, top website resources, and AI learning assistance.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <!-- App Main Container -->
  <div id="app">
    <!-- Dynamic view rendered by app.js -->
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Video Player Modal -->
  <div id="video-modal" class="modal-backdrop hidden">
    <div class="modal-card video-modal-card">
      <button class="modal-close-btn" id="close-video-modal"><i class="fa-solid fa-xmark"></i></button>
      <h3 id="video-modal-title" class="modal-title">Watch Educational Video</h3>
      <div class="video-iframe-container" id="video-iframe-wrapper">
        <!-- iframe inserted dynamically -->
      </div>
    </div>
  </div>

  <!-- Main JavaScript File -->
  <script src="/js/app.js"></script>
</body>

</html>
